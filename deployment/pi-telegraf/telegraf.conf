[agent]
  interval = "60s"
  flush_interval = "10s"
  hostname = "${PI_HOST:?missing Pi identity}"
  metric_batch_size = 100
  metric_buffer_limit = 1000

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  fieldinclude = ["usage_idle", "usage_iowait"]

[[inputs.system]]
  fieldinclude = ["uptime", "load1", "load5", "load15"]

[[inputs.mem]]
  fieldinclude = ["used_percent", "available", "total"]

[[inputs.swap]]
  fieldinclude = ["used_percent"]

[[inputs.disk]]
  mount_points = ["/", "/home", "/mnt/vault-hdd", "/mnt/vault-ssd"]
  fieldinclude = ["used_percent", "free", "total"]
  taginclude = ["host", "path"]

[[inputs.net]]
  interfaces = ["eth*", "en*", "wlan*", "wl*"]
  fieldinclude = ["bytes_sent", "bytes_recv", "err_in", "err_out"]
  taginclude = ["host", "interface"]

[[inputs.wireless]]
  fieldinclude = ["level"]
  taginclude = ["host", "interface"]

[[inputs.exec]]
  commands = [["/usr/bin/python3", "-I", "/usr/local/lib/wg-pi-telegraf/hardware.py"]]
  timeout = "8s"
  data_format = "influx"

[[inputs.exec]]
  commands = [["/usr/local/lib/wg-pi-telegraf/apt-updates"]]
  interval = "6h"
  timeout = "60s"
  data_format = "influx"

[[outputs.influxdb_v2]]
  urls = ["${PI_INFLUX_URL:?missing local CT111 URL}"]
  organization = "worganisation"
  bucket = "pi-hosts"
  token = "${PI_INFLUX_TOKEN:?missing host writer}"
  timeout = "5s"
