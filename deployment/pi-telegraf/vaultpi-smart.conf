[[inputs.smart]]
  interval = "5m"
  startup_error_behavior = "ignore"
  path_smartctl = "/usr/sbin/smartctl"
  use_sudo = true
  devices = ["/dev/sda -d sat", "/dev/sdb -d sat", "/dev/nvme0"]
  enable_extensions = []
  attributes = true
  timeout = "10s"
  metricpass = 'name == "smart_device" || ("id" in tags && tags["id"] in ["5", "197"])'
  fieldinclude = ["health_ok", "temp_c", "percentage_used", "raw_value"]
  taginclude = ["host", "device", "id"]
