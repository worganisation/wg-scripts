---
name: Deploy Release

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: wg-scripts-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: '!github.event.release.prerelease'
    environment: production-deploy
    runs-on: [self-hosted, linux, x64, cc, iac, opentofu]
    timeout-minutes: 15
    steps:
      - name: Set up LAN SSH
        id: ssh
        # yamllint disable-line rule:line-length
        uses: worganisation/github-config-files/actions/lan-ssh@ff2bdafb7120c951c6dfa6d968e1e4a69b9092ec
        with:
          private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          known-hosts: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}

      - name: Deploy to Pis
        env:
          TAG: ${{ github.event.release.tag_name }}
          SSH_CONFIG: ${{ steps.ssh.outputs.config }}
          WG_SCRIPTS_HOSTS: pi@10.0.0.51,worgarside@10.0.0.241,worgarside@10.0.0.52
        run: |
          set -uo pipefail

          if ! [[ "$TAG" =~ ^[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release tag: ${TAG}"
            exit 1
          fi

          IFS=',' read -ra HOSTS <<< "${WG_SCRIPTS_HOSTS}"

          ok=0
          failed=0
          {
            echo "## Deploy \`${TAG}\`"
            echo ""
            echo "| Host | User | Result |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for entry in "${HOSTS[@]}"; do
            entry="$(echo "$entry" | xargs)"
            if [[ -z "$entry" ]]; then
              continue
            fi

            if [[ "$entry" == *@* ]]; then
              user="${entry%%@*}"
              host="${entry#*@}"
            else
              user=""
              host="$entry"
            fi

            if [[ ! "$user" =~ ^[a-z_][a-z0-9_-]*$ || ! "$host" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]; then
              echo "::warning::Invalid host entry: ${entry}"
              failed=$((failed + 1))
              continue
            fi

            install_dir="/home/${user}/wg-scripts"

            echo "::group::Deploy ${TAG} → ${user}@${host}"
            if ssh -F "$SSH_CONFIG" \
              "${user}@${host}" \
              "bash -lc 'cd ${install_dir} && just deploy ${TAG}'"; then
              echo "OK: ${user}@${host}"
              echo "| \`${host}\` | \`${user}\` | OK |" >> "$GITHUB_STEP_SUMMARY"
              ok=$((ok + 1))
            else
              echo "::warning::Failed to deploy ${TAG} to ${user}@${host}"
              echo "| \`${host}\` | \`${user}\` | failed |" >> "$GITHUB_STEP_SUMMARY"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done

          {
            echo ""
            echo "Succeeded: ${ok} / $((ok + failed))"
            echo "Failed: ${failed} / $((ok + failed))"
          } >> "$GITHUB_STEP_SUMMARY"

          # Soft-fail only partial failures: one unreachable Pi must not fail
          # the release deploy. But if every host failed, that is systemic
          # (bad key, LAN routing, missing tag) and must surface.
          if [[ "$ok" -eq 0 ]]; then
            echo "::error::All ${failed} host(s) failed to deploy ${TAG}"
            exit 1
          fi
          exit 0
